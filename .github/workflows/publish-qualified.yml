name: Publish qualified Numerics 2.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numerics-qualified-2.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'boutquin/Boutquin.Numerics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download the original qualified release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern 'Boutquin.Numerics.2.0.0.nupkg' --pattern 'Boutquin.Numerics.2.0.0.snupkg'
      - name: Verify exact archives and qualified source tag
        run: |
          python3 scripts/verify-qualified-release.py release-assets "$(git rev-parse 'refs/tags/v2.0.0^{commit}')"
      - name: Publish the verified archives without rebuilding
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          dotnet nuget push release-assets/Boutquin.Numerics.2.0.0.nupkg --no-symbols --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          dotnet nuget push release-assets/Boutquin.Numerics.2.0.0.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
